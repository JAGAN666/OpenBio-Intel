name: Bug report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the actual behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands / API calls / UI actions, in order.
      placeholder: |
        1. Run `.venv/bin/python research_agent.py --question "..."`
        2. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs / stack trace
      description: Paste the actual error output. Please redact any API keys or secrets first.
      render: shell

  - type: dropdown
    id: component
    attributes:
      label: Which part of the project?
      options:
        - Agent / retrieval (research_agent.py)
        - API (api.py)
        - Frontend (Next.js)
        - Ingestion scripts (fetch_*.py / seed_bulk_data.py)
        - Knowledge graph (build_kg.py)
        - Docker Compose / quickstart.sh
        - Terraform / AWS deployment
        - Other / not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, how you're running it (quickstart.sh / manual local / Docker Compose / AWS), Python version, Node version if relevant.
      placeholder: "macOS 15, Apple Silicon, quickstart.sh, Python 3.10"
    validations:
      required: true
